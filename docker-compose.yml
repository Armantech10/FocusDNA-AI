version: '3.8'

services:
  # 1. FocusDNA FastAPI Backend API & ML Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focusdna-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,https://focusdna.ai
      - DATABASE_URL=postgresql://focusdna:focusdna_pass@postgres:5432/focusdna_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. Production PostgreSQL Database Container
  postgres:
    image: postgres:15-alpine
    container_name: focusdna-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=focusdna
      - POSTGRES_PASSWORD=focusdna_pass
      - POSTGRES_DB=focusdna_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusdna -d focusdna_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
