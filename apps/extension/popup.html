<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FocusDNA AI Attention Gauge</title>
  <style>
    body {
      width: 300px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #090d16;
      color: #f3f4f6;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      font-weight: 800;
      font-size: 16px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand span {
      color: #6366f1;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-badge.paused {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.3);
    }
    .score-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-bottom: 14px;
    }
    .score-val {
      font-size: 38px;
      font-weight: 900;
      color: #10b981;
      line-height: 1;
    }
    .score-label {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
      font-family: monospace;
      text-transform: uppercase;
    }
    .info-box {
      background: rgba(17, 24, 39, 0.6);
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 10px;
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 14px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .info-row:last-child {
      margin-bottom: 0;
    }
    .info-val {
      color: #ffffff;
      font-weight: 600;
      font-family: monospace;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-pause {
      background: #f59e0b;
      color: #ffffff;
    }
    .btn-pause:hover {
      background: #d97706;
    }
    .btn-resume {
      background: #10b981;
      color: #ffffff;
    }
    .btn-resume:hover {
      background: #059669;
    }
    .footer-link {
      display: block;
      text-align: center;
      font-size: 11px;
      color: #6366f1;
      text-decoration: none;
      margin-top: 10px;
    }
    .footer-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Focus<span>DNA</span> AI</div>
    <div id="statusBadge" class="status-badge">Active</div>
  </div>

  <div class="score-card">
    <div id="scoreVal" class="score-val">88</div>
    <div class="score-label">Heuristic Focus Score</div>
  </div>

  <div class="info-box">
    <div class="info-row">
      <span>Active Domain:</span>
      <span id="activeDomain" class="info-val">github.com</span>
    </div>
    <div class="info-row">
      <span>Privacy Filter:</span>
      <span class="info-val" style="color: #10b981;">Zero Keystrokes</span>
    </div>
  </div>

  <button id="togglePauseBtn" class="btn btn-pause">Pause Tracking</button>

  <a href="options.html" target="_blank" class="footer-link">Extension Options & Privacy Settings</a>

  <script src="dist/popup.js" type="module"></script>
</body>
</html>
